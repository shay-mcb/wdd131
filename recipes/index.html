<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta author="Shay McBride">
    <meta description="Database of recipes">
    <title>Recipe Book</title>
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="Database of recipes">
    <meta property="og:url" content="https://shay-mcb.github.io/wdd131/recipes/index.html">
    <meta property="og:image" content="">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="Database of recipes">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Special+Gothic:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img class="head-img" src="images/recipe-book.png" alt="recipe book logo">
        <h1>RecipeBook</h1>
        <form class="search-bar-container">
            <input class="search-bar" id="findRecipe" name="findRecipe" type="text" placeholder="Find a recipe">
            <hr class="mini-line">
            <img class="search-img" src="images/search.svg">
        </form>
    </header>
    <hr class="main-divider">
    <main>
        <div class="recipe-card">
            <img class="recipe-img" src="images/apple-crisp.jpg" alt="apple crisp">
            <div class="recipe-elements">
                <button class="dessert-box">dessert</button>
                <h2>Apple Crisp</h2>
                <span
                class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars">
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span> 
                <p>This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
            </div>
        </div>
    </main>
    <footer>
        <div class="footer-imgs">
            <img class="insta" src="images/instagram_icon.svg">
            <img class="youtube" src="images/youtube_icon.svg">
            <img class="pinterest" src="images/pinterest_icon.svg">
        </div>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>              
    </footer>
</body>
</html>
